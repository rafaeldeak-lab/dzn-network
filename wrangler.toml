name = "dzn-network"
compatibility_date = "2026-05-13"
pages_build_output_dir = "./out"

[[d1_databases]]
binding = "DB"
database_name = "dzn_network_db"
database_id = "37515c66-2787-49e4-8568-a461517e975e"

# Production activation approved after the isolated 0070 migration was verified.
[env.production.vars]
DZN_GAMES_HUB_ENABLED = "true"
DZN_GAMES_TRIVIA_ENABLED = "true"
DZN_GAMES_WORD_CHAIN_ENABLED = "true"
DZN_GAMES_HIDE_SEEK_ENABLED = "true"
DZN_SERVER_REVIEW_OWNER_REPLIES_ENABLED = "true"
# These are intentionally public build-time flags. Pages secrets are available
# to Functions but are not bundled into the static Next.js client.
NEXT_PUBLIC_DZN_COMMS_LIVE_UI_ENABLED = "true"
NEXT_PUBLIC_DZN_COMMS_MESSAGE_HISTORY_UI_ENABLED = "true"

# Pages requires every non-inheritable binding alongside environment overrides.
[[env.production.d1_databases]]
binding = "DB"
database_name = "dzn_network_db"
database_id = "37515c66-2787-49e4-8568-a461517e975e"
