name: DZN Owner Console Preview
# GitHub Support diagnostic: workflow registration refresh only; no runtime behavior change.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Action to run
        required: true
        type: choice
        default: full-preview
        options:
          - full-preview
          - cleanup-preview-d1
          - rebind-preview-d1
          - repair-rebound-discord-preview
          - verify-existing-creator-governance-preview
          - event-platform-performance-preview
          - billing-phase-1-preview
          - audit-preview-d1-capacity
      confirm_preview_only:
        description: Must equal PREVIEW_ONLY
        required: false
        default: ""
      preview_db_name_to_delete:
        description: Exact stale preview D1 database name for cleanup mode
        required: false
        default: ""
      cleanup_action:
        description: Cleanup mode action
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - delete
      reviewed_preview_db_id_mask:
        description: Masked D1 database ID from the reviewed inventory, e.g. abcdef12...1234
        required: false
        default: ""
      confirm_preview_db_cleanup:
        description: Must equal APPROVE_STALE_PREVIEW_D1_CLEANUP for cleanup mode
        required: false
        default: ""
      rebind_action:
        description: Rebind mode action
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirm_preview_d1_rebind:
        description: Must equal APPROVE_PREVIEW_D1_REBIND for rebind mode
        required: false
        default: ""
      repair_action:
        description: Repair mode action
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirm_rebound_discord_preview_repair:
        description: Must equal APPROVE_REPAIR_REBOUND_DISCORD_PREVIEW for repair mode
        required: false
        default: ""
      confirm_existing_creator_governance_preview:
        description: Must equal VERIFY_EXISTING_CREATOR_GOVERNANCE_PREVIEW for existing preview verification mode
        required: false
        default: ""
      confirm_event_platform_performance_preview:
        description: Must equal APPROVE_EVENT_PLATFORM_PERFORMANCE_PREVIEW for Phase 2A performance preview mode
        required: false
        default: ""
      confirm_billing_phase_1_preview:
        description: Must equal APPROVE_BILLING_PHASE_1_PREVIEW for Billing Phase 1 preview mode
        required: false
        default: ""
      confirm_d1_capacity_audit:
        description: Must equal APPROVE_D1_CAPACITY_AUDIT for read-only D1 capacity audit mode
        required: false
        default: ""

concurrency:
  group: dzn-owner-console-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  owner-console-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PULSE_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PULSE_PREVIEW_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PREVIEW_D1_CLEANUP_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_CLEANUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      DZN_PLATFORM_OWNER_DISCORD_IDS: "990000000000000101,990000000000000102"
      DZN_PLATFORM_CREATOR_DISCORD_ID: "990000000000000102"
      CANDIDATE_REF: ${{ github.ref }}
      CANDIDATE_BRANCH: ${{ github.ref_name }}
      CANDIDATE_SHA: ${{ github.sha }}
      MODE: ${{ inputs.mode }}
      CONFIRM_PREVIEW_ONLY: ${{ inputs.confirm_preview_only }}
      PREVIEW_PROJECT_NAME: dzn-network-owner-console-preview
      PREVIEW_DB_NAME: dzn_network_db_owner_console_preview
      PREVIEW_DB_NAME_TO_DELETE: ${{ inputs.preview_db_name_to_delete }}
      CLEANUP_ACTION: ${{ inputs.cleanup_action }}
      REVIEWED_PREVIEW_DB_ID_MASK: ${{ inputs.reviewed_preview_db_id_mask }}
      CONFIRM_PREVIEW_DB_CLEANUP: ${{ inputs.confirm_preview_db_cleanup }}
      REBIND_ACTION: ${{ inputs.rebind_action }}
      CONFIRM_PREVIEW_D1_REBIND: ${{ inputs.confirm_preview_d1_rebind }}
      REBIND_PREVIEW_PROJECT_NAME: dzn-network-discord-announcements-preview
      REBIND_OLD_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview_alignment_ee8c812
      REBIND_OLD_PREVIEW_DB_ID_MASK: 44ef61d8...ef59
      REBIND_REPLACEMENT_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview
      ACTIVATE_PREVIEW_PROJECT_NAME: dzn-network-discord-announcements-preview
      ACTIVATE_REPLACEMENT_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview
      ACTIVATE_OLD_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview_alignment_ee8c812
      ACTIVATE_OLD_PREVIEW_DB_ID_MASK: 44ef61d8...ef59
      APPROVED_MAIN_RUNTIME_SHA: a159571079dda1d8f0102718732008033cdfb763
      CONFIRM_REBOUND_DISCORD_PREVIEW_DEPLOY: ""
      REPAIR_ACTION: ${{ inputs.repair_action }}
      CONFIRM_REBOUND_DISCORD_PREVIEW_REPAIR: ${{ inputs.confirm_rebound_discord_preview_repair }}
      REPAIR_PREVIEW_PROJECT_NAME: dzn-network-discord-announcements-preview
      REPAIR_REPLACEMENT_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview
      REPAIR_OLD_PREVIEW_DB_NAME: dzn_network_db_discord_announcements_preview_alignment_ee8c812
      REPAIR_OLD_PREVIEW_DB_ID_MASK: 44ef61d8...ef59
      CONFIRM_EXISTING_CREATOR_GOVERNANCE_PREVIEW: ${{ inputs.confirm_existing_creator_governance_preview }}
      EXISTING_CREATOR_GOVERNANCE_PREVIEW_PROJECT_NAME: dzn-network-owner-console-preview
      EXISTING_CREATOR_GOVERNANCE_PREVIEW_DB_NAME: dzn_network_db_owner_console_preview_creator_governance_0919c46
      EXISTING_CREATOR_GOVERNANCE_PREVIEW_EVENT_NAME: Creator Governance Preview Cup 0919c46
      EXISTING_CREATOR_GOVERNANCE_PREVIEW_EVENT_SLUG: creator-governance-preview-cup-0919c46
      CONFIRM_EVENT_PLATFORM_PERFORMANCE_PREVIEW: ${{ inputs.confirm_event_platform_performance_preview }}
      EVENT_PLATFORM_PERFORMANCE_PREVIEW_PROJECT_NAME: dzn-network-owner-console-preview
      EVENT_PLATFORM_PERFORMANCE_PREVIEW_DB_NAME: dzn_network_db_owner_console_preview_creator_governance_0919c46
      EVENT_PLATFORM_PERFORMANCE_PREVIEW_CONFIRMATION: APPROVE_EVENT_PLATFORM_PERFORMANCE_PREVIEW
      EVENT_PLATFORM_PERFORMANCE_PREVIEW_SEED_PREFIX: phase2a-preview-
      CONFIRM_BILLING_PHASE_1_PREVIEW: ${{ inputs.confirm_billing_phase_1_preview }}
      CONFIRM_D1_CAPACITY_AUDIT: ${{ inputs.confirm_d1_capacity_audit }}
      BILLING_PHASE_1_PREVIEW_PROJECT_NAME: dzn-network-owner-console-preview-billing-phase-1
      BILLING_PHASE_1_PREVIEW_DB_PREFIX: dzn_network_db_owner_console_preview_billing_phase_1_
      BILLING_PHASE_1_PREVIEW_CONFIRMATION: APPROVE_BILLING_PHASE_1_PREVIEW
      BILLING_PHASE_1_PREVIEW_STABLE_URL: https://dzn-network-owner-console-preview-billing-phase-1.pages.dev
      PRODUCTION_PAGES_PROJECT_NAME: dzn-network
      PRODUCTION_D1_DATABASE_NAME: dzn_network_db
      D1_ACCOUNT_DATABASE_LIMIT: "10"
      DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
      DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
      DZN_PULSE_ENABLED: "true"
      PREVIEW_BASE_URL: https://dzn-network-owner-console-preview.pages.dev

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Billing preview dependencies
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: npm ci

      - name: Validate preview-only inputs
        run: bash -e scripts/github-actions/dzn-owner-console-preview/01-validate-preview-only-inputs.sh

      - name: Install
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'verify-existing-creator-governance-preview' || inputs.mode == 'event-platform-performance-preview' }}
        run: npm ci

      - name: Preflight Billing Phase 1 preview
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/32-preflight-billing-phase-1-preview.sh

      - name: Verify existing creator-governance preview
        if: ${{ inputs.mode == 'verify-existing-creator-governance-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/02-verify-existing-creator-governance-preview.sh

      - name: Preflight event platform performance preview
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/03-preflight-event-platform-performance-preview.sh

      - name: Apply only Phase 2A migration 0057 to preview
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/04-apply-only-phase-2a-migration-0057-to-preview.sh

      - name: Seed deterministic Phase 2A preview data
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/05-seed-deterministic-phase-2a-preview-data.sh

      - name: Build Phase 2A preview runtime
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-owner-console-preview.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-owner-console-preview.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/06-build-phase-2a-preview-runtime.sh

      - name: Deploy Phase 2A preview from isolated directory
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
        run: bash -e scripts/github-actions/dzn-owner-console-preview/07-deploy-phase-2a-preview-from-isolated-directory.sh

      - name: Verify Phase 2A performance preview
        if: ${{ inputs.mode == 'event-platform-performance-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/08-verify-phase-2a-performance-preview.sh

      - name: Upload Phase 2A preview artifact
        if: ${{ always() && inputs.mode == 'event-platform-performance-preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: dzn-event-platform-performance-preview
          path: dzn-event-platform-performance-preview
          if-no-files-found: warn

      - name: Validate branch
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/09-validate-branch.sh

      - name: Diagnose Cloudflare preview auth
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'billing-phase-1-preview' || inputs.mode == 'audit-preview-d1-capacity' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/10-diagnose-cloudflare-preview-auth.sh

      - name: Audit preview D1 capacity
        if: ${{ inputs.mode == 'audit-preview-d1-capacity' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/39-audit-preview-d1-capacity.sh

      - name: Upload preview D1 capacity audit artifact
        if: ${{ always() && inputs.mode == 'audit-preview-d1-capacity' }}
        uses: actions/upload-artifact@v4
        with:
          name: dzn-preview-d1-capacity-audit
          path: dzn-preview-d1-capacity-audit
          if-no-files-found: warn

      - name: Guarded preview D1 cleanup
        if: ${{ inputs.mode == 'cleanup-preview-d1' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/11-guarded-preview-d1-cleanup.sh

      - name: Guarded Discord preview D1 rebind
        if: ${{ inputs.mode == 'rebind-preview-d1' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/12-guarded-discord-preview-d1-rebind.sh

      - name: Prepare pinned main runtime for Discord preview activation
        if: ${{ inputs.mode == 'activate-rebound-discord-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/13-prepare-pinned-main-runtime-for-discord-preview-activation.sh

      - name: Preflight rebound Discord preview activation
        if: ${{ inputs.mode == 'activate-rebound-discord-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/14-preflight-rebound-discord-preview-activation.sh

      - name: Build pinned main runtime for rebound Discord preview
        if: ${{ inputs.mode == 'activate-rebound-discord-preview' }}
        working-directory: runtime-main
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/15-build-pinned-main-runtime-for-rebound-discord-preview.sh

      - name: Deploy rebound Discord preview runtime
        if: ${{ inputs.mode == 'activate-rebound-discord-preview' }}
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/16-deploy-rebound-discord-preview-runtime.sh

      - name: Verify activated rebound Discord preview
        if: ${{ inputs.mode == 'activate-rebound-discord-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/17-verify-activated-rebound-discord-preview.sh

      - name: Audit and repair rebound Discord preview configuration
        if: ${{ inputs.mode == 'repair-rebound-discord-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/18-audit-and-repair-rebound-discord-preview-configuration.sh

      - name: Prepare pinned main runtime for rebound Discord preview repair
        if: ${{ inputs.mode == 'repair-rebound-discord-preview' && inputs.repair_action == 'apply' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/19-prepare-pinned-main-runtime-for-rebound-discord-preview-repair.sh

      - name: Build pinned main runtime for rebound Discord preview repair
        if: ${{ inputs.mode == 'repair-rebound-discord-preview' && inputs.repair_action == 'apply' }}
        working-directory: runtime-main
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-discord-announcements-preview.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/20-build-pinned-main-runtime-for-rebound-discord-preview-repair.sh

      - name: Deploy repaired rebound Discord preview from isolated directory
        if: ${{ inputs.mode == 'repair-rebound-discord-preview' && inputs.repair_action == 'apply' }}
        env:
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
        run: bash -e scripts/github-actions/dzn-owner-console-preview/21-deploy-repaired-rebound-discord-preview-from-isolated-directory.sh

      - name: Verify repaired rebound Discord preview
        if: ${{ inputs.mode == 'repair-rebound-discord-preview' && inputs.repair_action == 'apply' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/22-verify-repaired-rebound-discord-preview.sh

      - name: Resolve or create preview D1 database
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/23-resolve-or-create-preview-d1-database.sh

      - name: Apply preview D1 migrations
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/24-apply-preview-d1-migrations.sh

      - name: Verify Billing Phase 1 preview schema
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/33-verify-billing-phase-1-preview-schema.sh

      - name: Seed Billing Phase 1 preview fixtures
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/34-seed-billing-phase-1-preview-fixtures.sh

      - name: Seed preview-only owner console data
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/25-seed-preview-only-owner-console-data.sh

      - name: Check creator-governance preview test event fixture
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/26-check-creator-governance-preview-test-event-fixture.sh

      - name: Resolve or create preview Pages project
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/27-resolve-or-create-preview-pages-project.sh

      - name: Configure preview owner auth secrets
        if: ${{ inputs.mode == 'full-preview' || inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/28-configure-preview-owner-auth-secrets.sh

      - name: Configure Billing Phase 1 preview runtime
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/35-configure-billing-phase-1-preview-runtime.sh

      - name: Build Billing Phase 1 preview runtime
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        env:
          MOCK_AUTH: "true"
          MOCK_NITRADO: "true"
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-owner-console-preview-billing-phase-1.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-owner-console-preview-billing-phase-1.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/36-build-billing-phase-1-preview-runtime.sh

      - name: Deploy Billing Phase 1 preview runtime
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        env:
          MOCK_AUTH: "true"
          MOCK_NITRADO: "true"
          DZN_PULSE_ENABLED: "true"
          DZN_DISCORD_NOTIFICATIONS_ENABLED: "false"
          DZN_DISCORD_SERVER_ANNOUNCEMENTS_ENABLED: "false"
          DZN_APP_URL: https://dzn-network-owner-console-preview-billing-phase-1.pages.dev
          NEXT_PUBLIC_APP_URL: https://dzn-network-owner-console-preview-billing-phase-1.pages.dev
        run: bash -e scripts/github-actions/dzn-owner-console-preview/37-deploy-billing-phase-1-preview-runtime.sh

      - name: Verify Billing Phase 1 preview
        if: ${{ inputs.mode == 'billing-phase-1-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/38-verify-billing-phase-1-preview.sh

      - name: Upload Billing Phase 1 preview artifact
        if: ${{ always() && inputs.mode == 'billing-phase-1-preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: dzn-billing-phase-1-preview
          path: dzn-billing-phase-1-preview
          if-no-files-found: warn

      - name: Deploy preview Pages project
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/29-deploy-preview-pages-project.sh

      - name: Verify owner console preview
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/30-verify-owner-console-preview.sh

      - name: Verify creator-governance preview event row
        if: ${{ inputs.mode == 'full-preview' }}
        run: bash -e scripts/github-actions/dzn-owner-console-preview/31-verify-creator-governance-preview-event-row.sh
