name: DZN Single Migration Production Rollout

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact main commit containing the approved migration source
        required: true
      migration_name:
        description: One approved additive migration to apply
        required: true
        type: choice
        options:
          - 0096_games_hub_relay_rush.sql
          - 0097_games_hub_cipher_grid.sql
          - 0098_games_hub_echo_array.sql
          - 0099_games_hub_outpost_run.sql
          - 0100_games_hub_signal_shift.sql
          - 0101_games_hub_circuit_forge.sql
          - 0102_games_hub_ranger_range.sql
          - 0105_games_hub_night_run_recon.sql
          - 0107_dzn_command_centre.sql
          - 0108_dzn_survival_command_expeditions.sql
          - 0109_dzn_survival_command_loadouts.sql
      confirm_production_migration:
        description: Must equal APPLY_EXACTLY_ONE_DZN_MIGRATION
        required: true

concurrency:
  group: dzn-single-migration-production-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollout:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_D1_DATABASE_NAME: dzn_network_db
      PRODUCTION_D1_DATABASE_ID: 37515c66-2787-49e4-8568-a461517e975e
      MIGRATION_STAGE: .dzn-single-migration-stage
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      ROLLOUT_CONFIRMATION_INPUT: ${{ inputs.confirm_production_migration }}
      APPROVED_COMMIT_INPUT: ${{ inputs.approved_commit }}
      MIGRATION_NAME_INPUT: ${{ inputs.migration_name }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate production rollout boundary
        run: |
          set -euo pipefail

          if [ "${ROLLOUT_CONFIRMATION_INPUT}" != "APPLY_EXACTLY_ONE_DZN_MIGRATION" ]; then
            echo "::error::confirm_production_migration must equal APPLY_EXACTLY_ONE_DZN_MIGRATION."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow may only run from main."
            exit 1
          fi
          APPROVED_COMMIT="${APPROVED_COMMIT_INPUT}"
          if ! [[ "${APPROVED_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::approved_commit must be the exact 40-character main SHA."
            exit 1
          fi
          ROLLOUT_COMMIT="$(git rev-parse HEAD)"
          if [ "${ROLLOUT_COMMIT}" != "${APPROVED_COMMIT}" ]; then
            echo "::error::main HEAD ${ROLLOUT_COMMIT} does not match approved_commit ${APPROVED_COMMIT}."
            exit 1
          fi
          case "${MIGRATION_NAME_INPUT}" in
            0096_games_hub_relay_rush.sql|0097_games_hub_cipher_grid.sql|0098_games_hub_echo_array.sql|0099_games_hub_outpost_run.sql|0100_games_hub_signal_shift.sql|0101_games_hub_circuit_forge.sql|0102_games_hub_ranger_range.sql|0105_games_hub_night_run_recon.sql|0107_dzn_command_centre.sql|0108_dzn_survival_command_expeditions.sql|0109_dzn_survival_command_loadouts.sql) ;;
            *)
              echo "::error::migration_name is not an approved single-migration target."
              exit 1
              ;;
          esac
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::A valid CLOUDFLARE_ACCOUNT_ID is required."
            exit 1
          fi

          printf "ROLLOUT_COMMIT=%s\n" "${ROLLOUT_COMMIT}" >> "$GITHUB_ENV"
          printf "MIGRATION_NAME=%s\n" "${MIGRATION_NAME_INPUT}" >> "$GITHUB_ENV"

          {
            echo "## DZN Single Migration Production Rollout"
            echo "- Commit: ${ROLLOUT_COMMIT}"
            echo "- Migration: ${MIGRATION_NAME_INPUT}"
            echo "- Production D1: ${PRODUCTION_D1_DATABASE_NAME}"
            echo "- Website deployment: not run"
            echo "- Feature flags: unchanged"
            echo "- Discord: not contacted"
            echo "- Payments: not contacted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install source dependencies
        run: npm ci

      - name: Validate migration controller and source queue
        run: |
          set -euo pipefail
          npm run lint
          npm run test:production-migration-queue
          npm run test:single-migration-production-rollout
          npm run test:survival-command-loadout-migration-maintenance
          npm run test:games-hub
          git diff --check

      - name: Verify protected account-closure maintenance in production
        run: |
          set -euo pipefail
          if [ "${MIGRATION_NAME}" != "0109_dzn_survival_command_loadouts.sql" ]; then
            echo "Account-closure maintenance is not required for ${MIGRATION_NAME}."
            exit 0
          fi
          MAINTENANCE_RESPONSE="$(curl --silent --show-error --fail --max-time 20 --header "Accept: application/json" https://dayz-network.com/api/health/survival-command-loadout-migration)"
          MAINTENANCE_RESPONSE="${MAINTENANCE_RESPONSE}" node <<'NODE'
          let response;
          try {
            response = JSON.parse(process.env.MAINTENANCE_RESPONSE || "");
          } catch {
            throw new Error("Survival Command loadout maintenance did not return the expected JSON signal.");
          }
          const keys = response && Object.prototype.toString.call(response) === "[object Object]" ? Object.keys(response) : [];
          if (keys.length !== 1 || keys[0] !== "status" || response.status !== "survival-command-loadout-maintenance") {
            throw new Error("Survival Command loadout account-closure maintenance is not active in production.");
          }
          console.log("Survival Command loadout account-closure maintenance JSON signal verified in production.");
          NODE

      - name: Build an isolated migration stage
        run: |
          set -euo pipefail
          npx tsx scripts/dzn-single-migration-production-rollout.ts prepare \
            --migration "${MIGRATION_NAME}" \
            --stage-dir "${MIGRATION_STAGE}"
          test -s "${MIGRATION_STAGE}/migration-plan.json"
          test -s "${MIGRATION_STAGE}/wrangler.toml"

      - name: Confirm production D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN is required for this D1-only operation."
            exit 1
          fi
          D1_LIST="$(npx wrangler d1 list --json)"
          D1_LIST="${D1_LIST}" node <<'NODE'
          const databases = JSON.parse(process.env.D1_LIST || "[]");
          const target = databases.find((entry) => entry.name === process.env.PRODUCTION_D1_DATABASE_NAME);
          if (!target || target.uuid !== process.env.PRODUCTION_D1_DATABASE_ID) {
            throw new Error("Production D1 identity did not match dzn_network_db.");
          }
          console.log(`Production D1 verified: ${target.name} (${target.uuid}).`);
          NODE

      - name: Drain in-flight account-deletion operations before the preservation baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${MIGRATION_NAME}" != "0109_dzn_survival_command_loadouts.sql" ]; then
            echo "Account-deletion drain is not required for ${MIGRATION_NAME}."
            exit 0
          fi
          # New closures are blocked by the deployed maintenance flag. Wait for the
          # previous runtime grace window, then require two empty read-only samples.
          sleep 90
          OPERATION_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-account-deletion-operation-query)"
          OPERATIONS_FILE="${MIGRATION_STAGE}/account-deletion-operations.json"
          DRAIN_ATTEMPTS=30
          REQUIRED_CONSECUTIVE_EMPTY_READS=2
          consecutive_empty_reads=0
          for attempt in $(seq 1 "${DRAIN_ATTEMPTS}"); do
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${OPERATION_QUERY}" > "${OPERATIONS_FILE}"
            if npx tsx scripts/dzn-single-migration-production-rollout.ts verify-account-deletion-operations \
              --operations "${OPERATIONS_FILE}" >/dev/null 2>&1; then
              consecutive_empty_reads=$((consecutive_empty_reads + 1))
              if [ "${consecutive_empty_reads}" -ge "${REQUIRED_CONSECUTIVE_EMPTY_READS}" ]; then
                rm -f "${OPERATIONS_FILE}"
                echo "Account-deletion operations drained across ${REQUIRED_CONSECUTIVE_EMPTY_READS} consecutive read-only checks."
                exit 0
              fi
            else
              consecutive_empty_reads=0
            fi
            sleep 15
          done
          echo "::error::Account-deletion operations did not drain before the preservation baseline. No migration was applied."
          rm -f "${OPERATIONS_FILE}"
          exit 1

      - name: Record D1 recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info "${PRODUCTION_D1_DATABASE_NAME}" \
            --json > "${MIGRATION_STAGE}/time-travel-before.json"
          MIGRATION_STAGE="${MIGRATION_STAGE}" node <<'NODE'
          const fs = require("node:fs");
          const path = `${process.env.MIGRATION_STAGE}/time-travel-before.json`;
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          const entry = Array.isArray(payload) ? payload[0] : payload;
          const bookmark = entry?.bookmark ?? entry?.result?.bookmark ?? entry?.bookmarks?.[0]?.bookmark;
          if (!bookmark) throw new Error("Cloudflare did not return a D1 Time Travel bookmark.");
          fs.appendFileSync(process.env.GITHUB_ENV, `D1_BACKUP_BOOKMARK=${bookmark}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- D1 recovery bookmark: ${bookmark}\n`);
          console.log("Production D1 recovery bookmark recorded.");
          NODE

      - name: Verify ledger and empty target baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id;" > "${MIGRATION_STAGE}/ledger-before.json"
          npx tsx scripts/dzn-single-migration-production-rollout.ts verify-ledger \
            --migration "${MIGRATION_NAME}" \
            --ledger "${MIGRATION_STAGE}/ledger-before.json" \
            --phase before

          OBJECT_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-objects-query --migration "${MIGRATION_NAME}")"
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "${OBJECT_QUERY}" > "${MIGRATION_STAGE}/objects-before.json"
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "PRAGMA foreign_key_check;" > "${MIGRATION_STAGE}/foreign-key-check-before.json"
          npx tsx scripts/dzn-single-migration-production-rollout.ts verify-baseline \
            --migration "${MIGRATION_NAME}" \
            --objects "${MIGRATION_STAGE}/objects-before.json" \
            --foreign-key-check "${MIGRATION_STAGE}/foreign-key-check-before.json"

          STATE_TABLE="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-table --migration "${MIGRATION_NAME}")"
          if [ -n "${STATE_TABLE}" ]; then
            cleanup_state_rows() { rm -f "${MIGRATION_STAGE}/state-rows-before.json" "${MIGRATION_STAGE}/state-rows-after.json"; }
            trap cleanup_state_rows EXIT
            STATE_OBJECT_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-objects-query --migration "${MIGRATION_NAME}")"
            STATE_ROWS_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-rows-query --migration "${MIGRATION_NAME}")"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${STATE_OBJECT_QUERY}" > "${MIGRATION_STAGE}/state-objects-before.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA table_info(${STATE_TABLE});" > "${MIGRATION_STAGE}/state-table-info-before.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA foreign_key_list(${STATE_TABLE});" > "${MIGRATION_STAGE}/state-foreign-keys-before.json"
            npx tsx scripts/dzn-single-migration-production-rollout.ts verify-state-preservation-before \
              --migration "${MIGRATION_NAME}" \
              --objects "${MIGRATION_STAGE}/state-objects-before.json" \
              --table-info "${MIGRATION_STAGE}/state-table-info-before.json" \
              --foreign-keys "${MIGRATION_STAGE}/state-foreign-keys-before.json" \
              --foreign-key-check "${MIGRATION_STAGE}/foreign-key-check-before.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${STATE_ROWS_QUERY}" > "${MIGRATION_STAGE}/state-rows-before.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "SELECT COUNT(*) AS row_count FROM ${STATE_TABLE};" > "${MIGRATION_STAGE}/state-row-count-before.json"
            npx tsx scripts/dzn-single-migration-production-rollout.ts fingerprint \
              --rows "${MIGRATION_STAGE}/state-rows-before.json" > "${MIGRATION_STAGE}/state-fingerprint-before.sha256"
            rm "${MIGRATION_STAGE}/state-rows-before.json"
            echo "Private state-preservation baseline captured as a row count and SHA-256 fingerprint; source rows are not retained."
          fi

      - name: Apply exactly one staged migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "${PRODUCTION_D1_DATABASE_NAME}" \
            --remote \
            --config "${MIGRATION_STAGE}/wrangler.toml"

      - name: Verify ledger, schema, indexes, constraints, foreign keys, and zero rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVER_LIFECYCLE_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id;" > "${MIGRATION_STAGE}/ledger-after.json"
          npx tsx scripts/dzn-single-migration-production-rollout.ts verify-ledger \
            --migration "${MIGRATION_NAME}" \
            --ledger "${MIGRATION_STAGE}/ledger-after.json" \
            --phase after

          OBJECT_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-objects-query --migration "${MIGRATION_NAME}")"
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "${OBJECT_QUERY}" > "${MIGRATION_STAGE}/objects-after.json"
          while IFS= read -r TABLE_NAME; do
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA table_info(${TABLE_NAME});" > "${MIGRATION_STAGE}/table-info-${TABLE_NAME}.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA foreign_key_list(${TABLE_NAME});" > "${MIGRATION_STAGE}/foreign-keys-${TABLE_NAME}.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "SELECT COUNT(*) AS row_count FROM ${TABLE_NAME};" > "${MIGRATION_STAGE}/row-count-${TABLE_NAME}.json"
          done < <(npx tsx scripts/dzn-single-migration-production-rollout.ts print-target-tables --migration "${MIGRATION_NAME}")
          npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
            --command "PRAGMA foreign_key_check;" > "${MIGRATION_STAGE}/foreign-key-check-after.json"
          npx tsx scripts/dzn-single-migration-production-rollout.ts verify-schema \
            --stage-dir "${MIGRATION_STAGE}" \
            --objects "${MIGRATION_STAGE}/objects-after.json" \
            --foreign-key-check "${MIGRATION_STAGE}/foreign-key-check-after.json"

          STATE_TABLE="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-table --migration "${MIGRATION_NAME}")"
          if [ -n "${STATE_TABLE}" ]; then
            cleanup_state_rows() { rm -f "${MIGRATION_STAGE}/state-rows-before.json" "${MIGRATION_STAGE}/state-rows-after.json"; }
            trap cleanup_state_rows EXIT
            STATE_OBJECT_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-objects-query --migration "${MIGRATION_NAME}")"
            STATE_ROWS_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-rows-query --migration "${MIGRATION_NAME}")"
            STATE_LOADOUTS_QUERY="$(npx tsx scripts/dzn-single-migration-production-rollout.ts print-state-preservation-loadouts-query --migration "${MIGRATION_NAME}")"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${STATE_OBJECT_QUERY}" > "${MIGRATION_STAGE}/state-objects-after.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA table_info(${STATE_TABLE});" > "${MIGRATION_STAGE}/state-table-info-after.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "PRAGMA foreign_key_list(${STATE_TABLE});" > "${MIGRATION_STAGE}/state-foreign-keys-after.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${STATE_ROWS_QUERY}" > "${MIGRATION_STAGE}/state-rows-after.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "SELECT COUNT(*) AS row_count FROM ${STATE_TABLE};" > "${MIGRATION_STAGE}/state-row-count-after.json"
            npx wrangler d1 execute "${PRODUCTION_D1_DATABASE_NAME}" --remote --json \
              --command "${STATE_LOADOUTS_QUERY}" > "${MIGRATION_STAGE}/state-loadouts-after.json"
            npx tsx scripts/dzn-single-migration-production-rollout.ts fingerprint \
              --rows "${MIGRATION_STAGE}/state-rows-after.json" > "${MIGRATION_STAGE}/state-fingerprint-after.sha256"
            npx tsx scripts/dzn-single-migration-production-rollout.ts verify-state-preservation-after \
              --migration "${MIGRATION_NAME}" \
              --objects "${MIGRATION_STAGE}/state-objects-after.json" \
              --table-info "${MIGRATION_STAGE}/state-table-info-after.json" \
              --foreign-keys "${MIGRATION_STAGE}/state-foreign-keys-after.json" \
              --foreign-key-check "${MIGRATION_STAGE}/foreign-key-check-after.json" \
              --before-row-count "${MIGRATION_STAGE}/state-row-count-before.json" \
              --after-row-count "${MIGRATION_STAGE}/state-row-count-after.json" \
              --before-fingerprint "${MIGRATION_STAGE}/state-fingerprint-before.sha256" \
              --after-fingerprint "${MIGRATION_STAGE}/state-fingerprint-after.sha256" \
              --loadouts "${MIGRATION_STAGE}/state-loadouts-after.json"
            rm "${MIGRATION_STAGE}/state-rows-after.json" "${MIGRATION_STAGE}/state-loadouts-after.json"
          fi

          {
            echo "- Ledger/schema verification: passed"
            echo "- Feature activation: intentionally not performed"
            echo "- Website deployment: intentionally not performed"
            echo "- Discord, billing, and Nitrado actions: intentionally not performed"
          } >> "$GITHUB_STEP_SUMMARY"
