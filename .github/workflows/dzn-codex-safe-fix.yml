name: DZN Codex Safe Fix

on:
  workflow_dispatch:

jobs:
  platform-codex-safe-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pick safe platform issue
        run: npm run autodev:pick-safe-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Write platform Codex prompt
        run: |
          mkdir -p .autodev/reports
          cat > .autodev/reports/codex-safe-fix-prompt.md <<'PROMPT'
          # DZN Codex Safe Fix Prompt

          This workflow is a guarded issue-selector and prompt/report generator only. It does not run a paid Codex action, does not require OpenAI API credentials, and does not modify code by itself.

          DZN routine development is subscription-only AI work. Use only the ChatGPT/Codex usage included with the user's ChatGPT subscription, assume $0 extra monthly AI/API spend, and do not assume automatic credits or auto top-up are available.

          DZN AutoDev is platform-wide. Safe-fix work may cover low-risk docs, tests, UI, AutoDev, workflow-reporting, and other low-risk DZN platform issues when the issue passes labels and hard-block gates.

          Required behavior:
          - make the smallest coherent fix
          - use an isolated branch and open a PR only
          - never push main
          - never auto-merge
          - never deploy or mutate production
          - select tests by subsystem and risk
          - add or update regression tests for behavior changes
          - preserve ADM specialist systems
          - perform browser QA for user-facing changes
          - perform security review for sensitive changes

          Hard-blocked work:
          - destructive migrations or protected data deletion/reset
          - creating player_stats
          - weakening authentication, authorization, or 401/403 protection
          - removing same-category matchmaking guarantees
          - exposing secrets, tokens, or credentials
          - copying Cloudflare runtime secrets into GitHub
          - making GitHub Actions the primary ADM auto-sync runner
          - production Pages, Workers, D1, Stripe, Nitrado, Discord, or secret mutation
          - paid 24/7 Codex/OpenAI execution
          - any other metered AI provider, paid AI action, AI SDK credential, or API-key-backed autonomous execution path
          - assumptions that automatic credits, prepaid balances, pay-as-you-go billing, or auto top-up will cover automation cost

          High-risk work may be investigated and prepared in a PR only when explicitly assigned, but it must never be selected by this low-risk safe-fix workflow.
          PROMPT
      - name: Upload platform Codex prompt/report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dzn-codex-safe-fix-reports
          path: .autodev/reports
